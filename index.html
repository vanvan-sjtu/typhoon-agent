// ===================== 风圈公式（白海豚模型） =====================
function calcR7(windSpeed){
  if(windSpeed <= 35){
    return 60 + (windSpeed -15)*3.2;
  }else{
    return 124 + (windSpeed -35)*2.2;
  }
}
function calcR10(windSpeed){
  if(windSpeed <=35){
    return Math.max(8, 15 + (windSpeed -20)*1.6);
  }else{
    return 39 + (windSpeed -35)*1.05;
  }
}
function calcR12(windSpeed){
  if(windSpeed <=35){
    return Math.max(2, 6 + (windSpeed -25)*0.85);
  }else{
    return 14.5 + (windSpeed -35)*0.52;
  }
}
function getTyphoonClass(wind){
  if(wind <17.2) return "热带低压";
  else if(wind <24.5) return "热带风暴";
  else if(wind <32.7) return "强热带风暴";
  else if(wind <41.5) return "台风";
  else if(wind <50.9) return "强台风";
  else return "超强台风";
}

// ===================== 点在多边形内算法 =====================
function pointInPolygon(point, polygon) {
  let x = point[0], y = point[1];
  let inside = false;
  for (let i = 0, j = polygon.length -1; i < polygon.length; j = i++) {
    const xi = polygon[i][0], yi = polygon[i][1];
    const xj = polygon[j][0], yj = polygon[j][1];
    const intersect = ((yi > y) != (yj > y))
        && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// 海洋匹配
function isOcean(lng,lat){
  if(lat <22 && lng>105 && lng<125) return true;
  return false;
}

// 根据经纬度匹配省份，直接拿到省份内置高程、人口密度
function getProvinceInfo(lng,lat){
  const pt = [lng,lat];
  for(let p of provinceList){
    if(pointInPolygon(pt, p.poly)){
      return p;
    }
  }
  if(isOcean(lng,lat)){
    return {
      name:"南海海域",
      popDensity:0,
      oldChildRatio:0,
      elev:0,
      terrainType:"海洋",
      terrainDesc:"海域，无常住人口，仅威胁海上船舶、岛礁设施"
    }
  }
  return {
    name:"其他区域",
    popDensity:260,
    oldChildRatio:0.24,
    elev:200,
    terrainType:"复杂地形",
    terrainDesc:"地形复杂，需结合实地高程、流域做精细化风险研判"
  };
}

// 高程转地形风险分
function calcTerrainRiskScore(elev, provinceInfo){
  let score = 0;
  if(elev <50) score += 2.2;
  else if(elev<200) score +=1.0;
  else if(elev <800) score +=1.6;
  else score +=0.4;

  if(provinceInfo.terrainType.indexOf("山地")>=0){
    score += 1.2;
  }
  if(provinceInfo.terrainType.indexOf("平原")>=0){
    score +=0.6;
  }
  return score;
}

  })
  circle12 = new AMap.Circle({
    center:[120.0,32.0],
    radius:25*1000,
    strokeColor:"#111111",
    strokeWeight:2,
    fillColor:"#222222",
    fillOpacity:0.22
  })

  typhoonMarker = new AMap.Marker({
    position:[120.0,32.0],
    title:"台风中心（可拖拽）",
    draggable:true
  })

  typhoonMarker.on('dragend', function(e){
    const pos = e.target.getPosition();
    typhoonData.lng = pos.lng;
    typhoonData.lat = pos.lat;
    updateTyphoonOverlay();
  })

  map.add([circle7, circle10, circle12, typhoonMarker]);
}

function updateTyphoonOverlay(){
  const center = [typhoonData.lng, typhoonData.lat];
  circle7.setCenter(center);
  circle10.setCenter(center);
  circle12.setCenter(center);
  typhoonMarker.setPosition(center);

  const r7 = calcR7(typhoonData.wind);
  const r10 = calcR10(typhoonData.wind);
  const r12 = calcR12(typhoonData.wind);

  circle7.setRadius(r7 * 1000);
  circle10.setRadius(r10 * 1000);
  circle12.setRadius(r12 * 1000);
  typhoonData.radius = r7;
}

function initTyphoonData(windSpeed=35){
  typhoonData = {
    name:"模拟台风",
    lng:120.0,
    lat:32.0,
    wind: windSpeed,
    pressure: 1005 - windSpeed*0.85,
    moveDir:"西北",
    moveSpeed:18,
    radius: calcR7(windSpeed)
  }
  updateTyphoonOverlay();
}

// ========== 综合风险评估【受灾人口估算逻辑】 ==========
function evaluateRisk(){
  const wind = typhoonData.wind;
  const lng = typhoonData.lng;
  const lat = typhoonData.lat;
  const provinceInfo = getProvinceInfo(lng,lat);
  const elev = provinceInfo.elev;
  const R7 = typhoonData.radius;

  // 7级风圈面积 km²
  const area7 = Math.PI * R7 * R7;
  // 预估受灾人口 = 风圈面积 × 人口密度 × 脆弱人口暴露系数
  let estimatedAffected = area7 * provinceInfo.popDensity * provinceInfo.oldChildRatio;
  if(provinceInfo.name === "南海海域") estimatedAffected = 0;
  estimatedAffected = Math.round(estimatedAffected);

  let windScore = 0;
  if(wind < AGENT_CONFIG.windThreshold.low) windScore=1;
  else if(wind < AGENT_CONFIG.windThreshold.mid) windScore=2;
  else if(wind < AGENT_CONFIG.windThreshold.high) windScore=3;
  else windScore=4;

  const vulScore = provinceInfo.popDensity / 300 * provinceInfo.oldChildRatio * 10;
  const terrainScore = calcTerrainRiskScore(elev, provinceInfo);

  const totalScore = windScore * AGENT_CONFIG.windWeight
    + vulScore * AGENT_CONFIG.vulnerableWeight
    + terrainScore * AGENT_CONFIG.terrainWeight;

  if(totalScore <2) riskLevel="低风险";
  else if(totalScore<3) riskLevel="中风险";
  else if(totalScore<4) riskLevel="高风险";
  else riskLevel="极高风险";

  return {
    totalScore,
    riskLevel,
    windScore,
    vulScore,
    terrainScore,
    provinceInfo,
    elev,
    estimatedAffected
  };
}

// ========== 修复报告模板：强制固定【预估受灾人口】行，不会丢失 ==========
function generateLLMReport(evalResult){
  const tc = getTyphoonClass(typhoonData.wind);
  const prov = evalResult.provinceInfo;
  const elev = evalResult.elev;
  const affPop = evalResult.estimatedAffected;

  let popStr = "";
  if(affPop === 0){
    popStr = "预估受灾人口：0人（海域无常住人口）";
  }else if(affPop >= 100000000){
    popStr = `预估受灾人口：${(affPop / 100000000).toFixed(2)} 亿人`;
  }else if(affPop >=10000){
    popStr = `预估受灾人口：${(affPop / 10000).toFixed(2)} 万人`;
  }else{
    popStr = `预估受灾人口：${affPop} 人`;
  }

  const reportText = `【模拟台风灾害评估报告】
台风：${typhoonData.name}，台风等级：${tc}，综合风险等级：${evalResult.riskLevel}
台风中心坐标：经度${typhoonData.lng.toFixed(2)}，纬度${typhoonData.lat.toFixed(2)}
所属行政区：${prov.name}
地形高程：${elev} m，地形类型：${prov.terrainType}
${popStr}
> 实况：中心风速${typhoonData.wind}m/s，中心气压${typhoonData.pressure.toFixed(0)}hPa，向西北移动。
> 7级风圈半径：${typhoonData.radius.toFixed(1)}km；10级风圈：${calcR10(typhoonData.wind).toFixed(1)}km；12级风圈：${calcR12(typhoonData.wind).toFixed(1)}km
> 区域特征：${prov.terrainDesc}
> 风险研判：综合风险指数${evalResult.totalScore.toFixed(2)}。高程${elev}m，${elev<50?"地势低洼，暴雨易形成内涝":(elev>500?"山地地形，暴雨诱发滑坡泥石流风险高":"地势中等，需关注流域洪水")}
> 应急建议：结合区域人口暴露与地形条件，优先转移低洼、山区危险区域人员，加固构筑物，监测雨情地质灾害。
> 备注：受灾人口为简化模型估算，仅用于模拟演示，未精细考虑城镇分布、疏散、风圈跨多省情况。`;

  document.getElementById("report").innerText = reportText;
}

// ========== p5画布 黑白配色 ==========
function setup(){
  p = createCanvas(windowWidth, 260);
  background(240);
  fill(20);
  textSize(14);
  initMap();
  initTyphoonData(35);

  const slider = document.getElementById("sliderWind");
  const windTextDom = document.getElementById("windText");
  slider.oninput = function(){
    const newWind = Number(this.value);
    typhoonData.wind = newWind;
    typhoonData.pressure = 1005 - newWind*0.85;
    windTextDom.innerText = newWind;
    updateTyphoonOverlay();
  }

  document.getElementById("genReportBtn").addEventListener("click", ()=>{
    try{
      const res = evaluateRisk();
      generateLLMReport(res);
    }catch(err){
      console.error(err);
      document.getElementById("report").innerText = "评估计算异常！";
    }
  })
}

function draw(){
  background(245);
  fill(18);
  textSize(14);
  const tc = getTyphoonClass(typhoonData.wind);
  const prov = getProvinceInfo(typhoonData.lng, typhoonData.lat);
  text(`台风Agent实时状态`, 20, 30);
  text(`台风名称：${typhoonData.name}`, 20, 55);
  text(`台风等级：${tc}`, 20, 80);
  text(`中心风速：${typhoonData.wind} m/s`, 20,105);
  text(`7级风圈半径：${typhoonData.radius.toFixed(1)} km`, 20,130);
  text(`所属省份：${prov.name}`, 20,155);
  text(`综合风险等级：${riskLevel}`, 20,180);

  if(typhoonData.lng){
    push();
    noFill();
    stroke(130,130,130,110);
    strokeWeight(2);
    ellipse(width/2, height/2, typhoonData.radius*1.2, typhoonData.radius*1.2);
    stroke(70,70,70,130);
    ellipse(width/2, height/2, calcR10(typhoonData.wind)*1.2, calcR10(typhoonData.wind)*1.2);
    stroke(20,20,20,150);
    ellipse(width/2, height/2, calcR12(typhoonData.wind)*1.2, calcR12(typhoonData.wind)*1.2);
    pop();
  }
}

function windowResized(){
  resizeCanvas(windowWidth, 260);
}
</script>
